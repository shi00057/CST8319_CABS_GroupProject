spring:
  application:
    name: CST8319_CABS

  thymeleaf:
    cache: false

  datasource:
    hikari:
      maximum-pool-size: 10
  config:
    import: optional:application-local.yml

mybatis:
  mapper-locations: classpath*:/mappers/*.xml
  type-aliases-package: com.example.cabs.domain
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
