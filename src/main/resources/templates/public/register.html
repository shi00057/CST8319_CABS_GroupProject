<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Patient Registration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .form-grid { display:grid; gap:12px; max-width:460px; }
        .form-grid label { font-weight:600; }
        .actions { margin-top:12px; display:flex; gap:10px; }
        .muted { color:#666; font-size:0.95rem; }
        input, button, a.btn { padding:10px; border:1px solid #e5e7eb; border-radius:8px; }
        button { cursor:pointer; }
        a.btn { text-decoration:none; display:inline-block; }
        .alert { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; padding:10px; border-radius:8px; margin:12px 0; }
        .note  { background:#e0f2fe; color:#075985; border:1px solid #bae6fd; padding:10px; border-radius:8px; margin:12px 0; }
        .invalid { border-color:#ef4444; }
        .field-help { font-size:0.9rem; }
        .toggle-wrap { display:flex; align-items:center; gap:8px; }
    </style>
</head>
<body>
<header>
    <nav class="nav">
        <a class="brand" th:href="@{/}">CABS</a>
        <a th:href="@{/login}">Login</a>
    </nav>
</header>

<main>
    <section>
        <h2>Patient Registration</h2>

        <p class="muted">
            New accounts require office approval before you can sign in. Please wait for activation after submitting this form.
        </p>

        <!-- Optional server messages -->
        <div class="alert" th:if="${error}" th:text="${error}">Something went wrong.</div>
        <div class="note"  th:if="${message}" th:text="${message}">Registered successfully.</div>

        <form id="registerForm" method="post" th:action="@{/patient/register/submit}">
            <!-- CSRF (safe if enabled, ignored if disabled) -->
<!--            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>-->
            <div th:if="${_csrf != null}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            </div>


            <div class="form-grid">
                <div>
                    <label for="fullName">Full Name</label>
                    <input id="fullName" type="text" name="fullName" autocomplete="name" required/>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" autocomplete="email" required/>
                </div>

                <div>
                    <label for="phone">Phone</label>
                    <input id="phone" type="tel" name="phone" autocomplete="tel" required/>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" minlength="8" autocomplete="new-password" required/>
                    <div class="field-help muted">Minimum 8 characters.</div>
                    <div class="toggle-wrap">
                        <input id="togglePwd" type="checkbox" aria-controls="password confirmPassword"/>
                        <label for="togglePwd">Show passwords</label>
                    </div>
                </div>

                <div>
                    <label for="confirmPassword">Confirm Password</label>
                    <input id="confirmPassword" type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required/>
                    <div id="matchMsg" class="field-help muted"></div>
                </div>
            </div>

            <div class="actions">
                <button id="submitBtn" type="submit" disabled>Register</button>
                <a class="btn" th:href="@{/login}">Back to Login</a>
            </div>
        </form>
    </section>
</main>

<footer>© CST8319 Demo</footer>

<script>
    (function () {
        var pwd = document.getElementById('password');
        var cpw = document.getElementById('confirmPassword');
        var submitBtn = document.getElementById('submitBtn');
        var matchMsg = document.getElementById('matchMsg');
        var toggle = document.getElementById('togglePwd');

        function validate() {
            var bothFilled = pwd.value.length >= 8 && cpw.value.length >= 8;
            var same = pwd.value === cpw.value;
            if (cpw.value && !same) {
                matchMsg.textContent = 'Passwords do not match.';
                cpw.classList.add('invalid');
            } else {
                matchMsg.textContent = '';
                cpw.classList.remove('invalid');
            }
            submitBtn.disabled = !(bothFilled && same);
        }

        pwd.addEventListener('input', validate);
        cpw.addEventListener('input', validate);
        validate();

        toggle.addEventListener('change', function () {
            var type = toggle.checked ? 'text' : 'password';
            pwd.type = type;
            cpw.type = type;
        });
    })();
</script>
</body>
</html>
