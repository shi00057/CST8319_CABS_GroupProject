<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Manage Appointments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<main class="layout">
    <div th:replace="~{admin/_sidebar :: adminSidebar('appointments')}"></div>

    <section class="content">
        <h2>Manage Appointments</h2>
        <a class="btn" th:href="@{/admin}">Back to Dashboard</a>

        <div class="card">
            <form class="form-inline" th:action="@{/admin/appointments}" method="get">
                <input type="number" name="doctorId" min="1" placeholder="Doctor ID"
                       th:value="${doctorId}"/>
                <input type="number" name="patientId" min="1" placeholder="Patient ID"
                       th:value="${patientId}"/>
                <button type="submit">Filter</button>
            </form>

            <table class="table">
                <thead>
                <tr>
                    <th>Appt ID</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Doctor</th>
                    <th>Patient</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <!-- Appt ID -->
                    <td th:text="${a.apptId} ?: '-'">-</td>

                    <!-- Date -->
                    <td th:text="${#temporals.format(a.startUtc, 'yyyy-MM-dd')}">-</td>

                    <!-- Time -->
                    <td th:text="${#temporals.format(a.startUtc, 'HH:mm')}">-</td>

                    <!-- Doctor -->
                    <td th:text="${a.doctorName} ?: '-'">-</td>

                    <!-- Patient ID） -->
                    <td th:text="${a.patientId} ?: '-'">-</td>

                    <!-- Status -->
                    <td th:text="${a.status} ?: '-'">-</td>

                    <!-- Action -->
                    <td>
                        <form th:if="${a.cancellable}"
                              th:action="@{'/admin/appointments/' + ${a.apptId} + '/cancel'}"
                              method="post" style="display:inline">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Cancel appt #' + [[${a.apptId}]] + '?');">
                                Cancel
                            </button>
                        </form>
                        <span th:unless="${a.cancellable}" class="muted">—</span>
                    </td>
                </tr>

                <tr th:if="${appointments == null or #lists.isEmpty(appointments)}">
                    <td colspan="7">No appointments found.</td>
                </tr>
                </tbody>

            </table>
        </div>
    </section>
</main>
<footer>© CST8319 Demo</footer>
</body>
</html>
