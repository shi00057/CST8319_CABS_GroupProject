<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<main class="layout">
    <div th:replace="~{admin/_sidebar :: adminSidebar('dashboard')}"></div>

    <section class="content">
        <h2>
            Hello, <span th:text="${username} ?: ${#request.remoteUser}">Admin</span>.
            <small>Today is <span th:text="${#temporals.format(T(java.time.LocalDate).now(), 'yyyy-MM-dd')}">2025-10-25</span></small>
        </h2>

        <div class="card">
            <h3>Welcome</h3>
            <p>Use the sidebar to activate patients, register doctors, generate slots, manage appointments, or create reports.</p>
        </div>
    </section>
</main>

<footer>© CST8319 Demo</footer>
</body>
</html>
