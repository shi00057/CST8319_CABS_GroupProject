<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Generate Doctor Slots</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<main class="layout">
    <div th:replace="~{admin/_sidebar :: adminSidebar('slots')}"></div>

    <section class="content">
        <h2>Generate Doctor Slots</h2>
        <a class="btn" th:href="@{/admin}">Back to Dashboard</a>

        <div class="card" th:if="${error}">
            <p class="error" th:text="${error}">Error</p>
        </div>

        <div class="card">
            <form th:action="@{/admin/generate-slots}" method="post" class="form-grid">
                <label>
                    Doctor
                    <select name="doctorId" required>
                        <option value="" disabled selected>Select a doctor</option>
                        <option th:each="d : ${doctors}" th:value="${d.doctorId}" th:text="${d.fullName}">Dr. A</option>
                    </select>
                </label>
                <label>
                    Start Date
                    <input type="date" name="startDate" required/>
                </label>
                <label>
                    End Date
                    <input type="date" name="endDate" required/>
                </label>
                <div class="form-actions">
                    <button type="submit">Generate</button>
                </div>
            </form>
        </div>

        <div class="card" th:if="${generatedCount != null}">
            <p th:text="'Generated ' + ${generatedCount} + ' slots.'">Generated 0 slots.</p>
        </div>
        <div class="card" th:if="${message}">
            <p th:text="${message}">Done.</p>
        </div>
    </section>
</main>
<footer>© CST8319 Demo</footer>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var s = document.querySelector('input[name="startDate"]');
        var e = document.querySelector('input[name="endDate"]');
        var today = new Date().toISOString().slice(0,10);
        if (s && !s.value) s.value = today;
        if (e && !e.value) e.value = today;
    });
</script>
</body>
</html>
