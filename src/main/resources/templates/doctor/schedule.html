<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Generate Slots</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<main class="layout">
    <div th:replace="~{doctor/_sidebar :: doctorSidebar('schedule')}"></div>

    <section class="content">
        <header class="content-header">
            <h2>Generate Available Slots</h2>
            <a th:href="@{/doctor}" class="btn">Back to Dashboard</a>
        </header>

        <div class="card">
            <h3>Parameters</h3>
            <form th:action="@{/doctor/schedule/generate}" method="post" class="form-grid">
                <div>
                    <label for="workDate">Date</label>
                    <input id="workDate" name="workDate" type="date" required
                           th:value="${workDate}">
                </div>
                <div>
                    <label for="dayStart">Start Hour</label>
                    <input id="dayStart" name="dayStart" type="time" step="3600" value="09:00" required>
                </div>
                <div>
                    <label for="dayEnd">End Hour</label>
                    <input id="dayEnd" name="dayEnd" type="time" step="3600" value="17:00" required>
                </div>

                <div class="form-actions">
                    <button type="submit">Generate</button>
                </div>
            </form>

            <p class="muted" th:if="${message}" th:text="${message}">Result</p>
        </div>

        <div class="card">
            <h3>Available Slots</h3>
            <table class="table" th:if="${slots}">
                <thead>
                <tr>
                    <th>Start</th>
                    <th>End</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${slots}">
                    <td th:text="${#temporals.format(s.startUtc, 'yyyy-MM-dd HH:mm')}">2025-10-25 09:00</td>
                    <td th:text="${#temporals.format(s.endUtc, 'yyyy-MM-dd HH:mm')}">2025-10-25 09:30</td>
                </tr>
                </tbody>
            </table>
            <p th:if="${slots == null or #lists.isEmpty(slots)}" class="muted">
                No slots for the selected date.
            </p>
        </div>
    </section>
</main>

<footer>© CST8319 Demo</footer>
</body>
</html>
