<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Patient Registration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .form-grid { display:grid; gap:12px; max-width:420px; }
        .form-grid label { font-weight:600; }
        .actions { margin-top:12px; display:flex; gap:10px; }
        .muted { color:#666; font-size:0.95rem; }
        input, button, a.btn { padding:10px; border:1px solid #e5e7eb; border-radius:8px; }
        button { cursor:pointer; }
        a.btn { text-decoration:none; display:inline-block; }
    </style>
</head>
<body>
<header>
    <nav class="nav">
        <a class="brand" th:href="@{/}">CABS</a>
    </nav>
</header>
<main>
    <section>
        <h2>Patient Registration</h2>

        <p class="muted">
            New accounts require office approval before you can sign in. Please wait for activation after submitting this form.
        </p>

        <form method="post" th:action="@{/patient/register/submit}">
            <div class="form-grid">
                <div>
                    <label>Full Name</label>
                    <input type="text" name="fullName" required/>
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" name="email" required/>
                </div>
                <div>
                    <label>Phone</label>
                    <input type="tel" name="phone" placeholder="+1 613-555-1234"/>
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" name="password" minlength="8" required/>
                </div>
                <div>
                    <label>Confirm Password</label>
                    <input type="password" name="confirmPassword" minlength="8" required/>
                </div>
            </div>

            <div class="actions">
                <button type="submit">Register</button>
                <a class="btn" th:href="@{/login}">Back to Login</a>
            </div>
        </form>
    </section>
</main>
<footer>© CST8319 Demo</footer>
</body>
</html>
