<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Patient Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<main class="layout">
    <div th:replace="~{patient/_sidebar :: patientSidebar('dashboard')}"></div>

    <section class="content">
        <h2>
            Hello, <span th:text="${username} ?: ${#request.remoteUser}">Patient</span>.
            <small>Today is <span th:text="${#temporals.format(T(java.time.LocalDate).now(), 'yyyy-MM-dd')}">2025-10-20</span></small>
        </h2>

        <div class="card">
            <h3>Welcome</h3>
            <p>Use the left menu to create an appointment, manage existing appointments, or update your profile.</p>
        </div>
    </section>
</main>

<!-- Unread notifications panel -->
<div th:replace="~{patient/_notifications :: panel(${notifications})}"></div>

<footer>© CST8319 Demo</footer>
</body>
</html>
