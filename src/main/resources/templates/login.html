<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <nav class="nav">
        <a class="brand" th:href="@{/}">CABS</a>
    </nav>
</header>
<main>
    <section>
        <h2>Login</h2>
        <div th:if="${param.error}">Invalid username or password</div>
        <div th:if="${param.logout}">You have been signed out</div>
        <div th:if="${param.registered}">Registration submitted. Please wait for approval.</div>


        <form method="post" th:action="@{/login}">
            <div>
                <label>Username</label>
                <input type="text" name="username" required/>
            </div>
            <div>
                <label>Password</label>
                <input type="password" name="password" required/>
            </div>

            <button type="submit">Sign in</button>
            <button type="button" th:onclick="|window.location='@{/patient/register}'|">Create a patient account</button>
        </form>

        <p><a th:href="@{/}">Back</a></p>
    </section>
</main>
<footer>© CST8319 Demo</footer>
</body>
</html>
