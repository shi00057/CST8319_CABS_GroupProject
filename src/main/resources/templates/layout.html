<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'CABS'">CABS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<header>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/doctor}">Doctor</a>
        <a th:href="@{/patient}">Patient</a>
        <a th:href="@{/admin}">Admin</a>
        <a th:if="${#httpServletRequest.remoteUser == null}" th:href="@{/login}">Login</a>
        <form th:if="${#httpServletRequest.remoteUser != null}" th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit">Logout</button>
        </form>
    </nav>
</header>
<main>
    <div th:if="${flash != null}" th:text="${flash}"></div>
    <div th:insert="~{::body}"></div>
</main>
<footer>
    <small>CABS</small>
</footer>
</body>
</html>
